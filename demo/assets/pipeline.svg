<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 540" width="1300" height="540" role="img" aria-labelledby="t d">
  <title id="t">EvidenceTune pipeline: CuratorKIT, SafeTune, AuditKIT</title>
  <desc id="d">Licensed sources with blind double labels go into CuratorKIT, which validates them and exports two things. The training export goes to SafeTune, which trains a LoRA hardening adapter on Tiny Aya Global; an ordinary SFT adapter is trained on the same data as a control. The untouched evaluation pack (dev, test and transfer) is hashed before any outputs and goes straight to AuditKIT, never through training. AuditKIT runs both adapters and the inference-only baselines on identical cases and saves predictions, metrics, configs, fingerprints and paired intervals. The saved results feed the demo Space and the HF Article.</desc>
  <style>
    svg { --bg:#f3efe6; --surface:#f3efe6; --surface2:#ebe6da; --ink:#0b55b8; --ink2:#3c76c6; --line:#7d9fd4; --train:#0b55b8; --eval:#157a55; --model:#7d9fd4; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0a4ca6; --surface:#0a4ca6; --surface2:#083d87; --ink:#f3efe6; --ink2:#d6dcec; --line:#9fb6df; --train:#f3efe6; --eval:#7fe0b8; --model:#9fb6df; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .kit { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
    .box { fill: var(--surface2); stroke: var(--line); stroke-width: 1; }
    .pill-train { fill: var(--surface); stroke: var(--train); stroke-width: 1.5; }
    .pill-eval { fill: var(--surface); stroke: var(--eval); stroke-width: 1.5; }
    .h { font-size: 19px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--ink2); }
    .b { font-size: 13px; fill: var(--ink2); }
    .s { font-size: 12px; fill: var(--ink2); }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; fill: var(--ink2); }
    .f-train { stroke: var(--train); stroke-width: 2.5; fill: none; }
    .f-eval { stroke: var(--eval); stroke-width: 2.5; fill: none; }
    .f-model { stroke: var(--model); stroke-width: 2; fill: none; }
    .lbl-eval { font-size: 12px; font-weight: 600; fill: var(--eval); }
    .lbl-train { font-size: 12px; font-weight: 600; fill: var(--train); }
    .title { font-size: 20px; font-weight: 700; }
    .ah-train { fill: var(--train); } .ah-eval { fill: var(--eval); } .ah-model { fill: var(--model); }
  </style>
  <defs>
    <marker id="a-train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-train" d="M0 0 10 5 0 10z"/></marker>
    <marker id="a-eval" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-eval" d="M0 0 10 5 0 10z"/></marker>
    <marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-model" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" width="1300" height="540"/>
  <text class="h" x="24" y="40">Two exports. The test pack never touches training.</text>
  <text class="b" x="24" y="62">Every comparator, trained or not, is scored by AuditKIT on the same sealed cases.</text>

  <!-- Sources -->
  <rect class="box" x="24" y="200" width="170" height="154" rx="10"/>
  <text class="h2" x="40" y="228">Sources + labels</text>
  <text class="b" x="40" y="256">Licensed sources</text>
  <text class="b" x="40" y="278">Matched</text>
  <text class="b" x="40" y="296">counterfactuals</text>
  <text class="b" x="40" y="320">Blind double labels</text>
  <text class="b" x="40" y="338">+ adjudication</text>
  <path class="f-model" d="M194 277 H228" marker-end="url(#a-model)"/>

  <!-- CuratorKIT -->
  <rect class="kit" x="230" y="84" width="190" height="386" rx="12"/>
  <text class="tag" x="248" y="112">STAGE 1 · LEXSI-LABS</text>
  <text class="h" x="248" y="138">CuratorKIT</text>
  <text class="b" x="248" y="234">Validates schema</text>
  <text class="b" x="248" y="252">and labels</text>
  <text class="b" x="248" y="278">Keeps provenance</text>
  <text class="b" x="248" y="304">Leakage-safe splits</text>
  <text class="b" x="248" y="322">(by source + template)</text>
  <text class="b" x="248" y="348">Manifests + checksums</text>

  <!-- Train export -->
  <path class="f-train" d="M420 148 H454" marker-end="url(#a-train)"/>
  <rect class="pill-train" x="456" y="118" width="170" height="60" rx="30"/>
  <text class="h2" x="541" y="143" text-anchor="middle">Train export</text>
  <text class="s" x="541" y="162" text-anchor="middle">SFT + utility-retention</text>

  <!-- Eval pack -->
  <path class="f-eval" d="M420 440 H454" marker-end="url(#a-eval)"/>
  <rect class="pill-eval" x="456" y="410" width="170" height="60" rx="30"/>
  <text class="h2" x="541" y="435" text-anchor="middle">Untouched eval pack</text>
  <text class="s" x="541" y="454" text-anchor="middle">dev · test · transfer</text>

  <!-- Train flows -->
  <path class="f-train" d="M626 148 H660" marker-end="url(#a-train)"/>
  <path class="f-train" d="M644 148 V238 H660" marker-end="url(#a-train)"/>

  <!-- SafeTune -->
  <rect class="kit" x="662" y="84" width="210" height="116" rx="12"/>
  <text class="tag" x="680" y="110">STAGE 2 · LEXSI-LABS</text>
  <text class="h" x="680" y="135">SafeTune</text>
  <text class="b" x="680" y="160">Schema adapter (our code)</text>
  <text class="b" x="680" y="180">LoRA on Tiny Aya Global</text>

  <!-- Ordinary SFT -->
  <rect class="box" x="662" y="214" width="210" height="50" rx="10"/>
  <text class="h2" x="678" y="235">Ordinary SFT LoRA</text>
  <text class="s" x="678" y="253">same data · control</text>

  <!-- Baselines -->
  <rect class="box" x="662" y="290" width="210" height="78" rx="10"/>
  <text class="h2" x="678" y="313">Inference-only baselines</text>
  <text class="s" x="678" y="333">base Aya · never-update</text>
  <text class="s" x="678" y="351">TF-IDF gate · evidence prompt</text>

  <!-- Model flows into AuditKIT -->
  <path class="f-model" d="M872 142 H906" marker-end="url(#a-model)"/>
  <path class="f-model" d="M872 239 H906" marker-end="url(#a-model)"/>
  <path class="f-model" d="M872 329 H906" marker-end="url(#a-model)"/>

  <!-- Eval bypass -->
  <path class="f-eval" d="M626 440 H906" marker-end="url(#a-eval)"/>
  <text class="lbl-eval" x="767" y="428" text-anchor="middle">Hashed before any outputs</text>
  <text class="lbl-eval" x="767" y="460" text-anchor="middle">never seen in training</text>

  <!-- AuditKIT -->
  <rect class="kit" x="908" y="84" width="190" height="386" rx="12"/>
  <text class="tag" x="926" y="112">STAGE 3 · LEXSI-LABS</text>
  <text class="h" x="926" y="138">AuditKIT</text>
  <text class="b" x="926" y="190">Identical cases for</text>
  <text class="b" x="926" y="208">every comparator</text>
  <text class="b" x="926" y="234">Raw outputs + metrics</text>
  <text class="b" x="926" y="260">Configs + fingerprints</text>
  <text class="b" x="926" y="286">Paired, case-clustered</text>
  <text class="b" x="926" y="304">intervals</text>

  <!-- Outputs -->
  <path class="f-model" d="M1098 230 H1132" marker-end="url(#a-model)"/>
  <rect class="box" x="1134" y="196" width="142" height="68" rx="10"/>
  <text class="h2" x="1150" y="221">Saved results</text>
  <text class="mono" x="1150" y="242">results/&lt;run&gt;/</text>
  <path class="f-model" d="M1205 264 V290" marker-end="url(#a-model)"/>
  <rect class="box" x="1134" y="292" width="142" height="40" rx="10"/>
  <text class="h2" x="1150" y="317">Demo · HF Space</text>
  <path class="f-model" d="M1205 332 V352" marker-end="url(#a-model)"/>
  <rect class="box" x="1134" y="354" width="142" height="40" rx="10"/>
  <text class="h2" x="1150" y="379">HF Article + data</text>

  <!-- Legend -->
  <g transform="translate(24 506)">
    <path class="f-train" d="M0 0 H28"/><text class="s" x="36" y="4">training data</text>
    <path class="f-eval" d="M150 0 H178"/><text class="s" x="186" y="4">sealed evaluation data</text>
    <path class="f-model" d="M346 0 H374"/><text class="s" x="382" y="4">models and results</text>
  </g>
</svg>
