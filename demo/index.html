<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvidenceTune Demo</title>
  <meta name="description" content="Does a model change its answer only when the evidence says so? A matched-pair demo on Tiny Aya Global.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Martian+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to demo</a>

  <header class="top">
    <div class="wrap nav">
      <a class="logo" href="./" aria-label="EvidenceTune home"><span class="logo-mark" aria-hidden="true"></span>EvidenceTune</a>
      <nav class="tabs" aria-label="Demo steps" id="steps">
        <button type="button" data-step="0"><em>01</em>Base model</button>
        <button type="button" data-step="1"><em>02</em>Tuned model</button>
        <button type="button" data-step="2"><em>03</em>Outcome</button>
      </nav>
      <div class="actions">
        <button type="button" class="btn icon" id="prev" aria-label="Previous step">←</button>
        <button type="button" class="btn icon" id="next" aria-label="Next step">→</button>
        <a class="btn dark" href="https://github.com/kendramoss/exsi-lexsi-hackathon" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="head">
      <div class="head-text">
        <h1 id="headline"></h1>
      </div>
      <div class="controls">
        <span class="mock" id="mock-badge" hidden>MOCK DATA</span>
        <label class="select" for="family"><span>Pair</span><select id="family"></select></label>
        <label class="select" for="comparator" id="comparator-wrap"><span>Compare</span><select id="comparator"></select></label>
      </div>
    </section>

    <section class="stage" id="stage-pair" aria-label="Matched pair">
      <div class="canvas">
        <div class="board">
          <article class="passage" id="passage"></article>
          <div class="pair" id="pair"></div>
          <p class="hand" id="note" hidden></p>
        </div>
        <aside class="inspector" id="inspector" aria-label="Case inspector"></aside>
      </div>
    </section>

    <section class="stage" id="stage-outcome" aria-label="Outcome">
      <p class="lead">0% caving means nothing <span>if valid uptake drops with it.</span></p>
      <div class="cards" id="cards"></div>
      <div class="win table-win">
        <div class="win-bar"><i></i><i></i><i></i><span id="table-path"></span></div>
        <div class="table-scroll"><table class="scoreboard" id="scoreboard"></table></div>
      </div>
      <p class="fine" id="score-note"></p>
    </section>

    <details class="how">
      <summary>How it's built</summary>
      <div class="how-fig">
        <img src="assets/pipeline.svg" width="1300" height="540" loading="lazy"
             alt="Pipeline. CuratorKIT validates labelled sources and makes two exports. The training export goes to SafeTune (LoRA on Tiny Aya Global) and to an ordinary SFT control. The untouched eval pack is hashed before any outputs and goes straight to AuditKIT, never through training. AuditKIT scores both adapters and the inference-only baselines on identical cases, and the saved results feed this demo and the HF Article.">
      </div>
    </details>
  </main>

  <footer class="wrap foot">
    <p>Data: <code id="src-path"></code> · Design: <a href="?skin=a">A</a> <a href="?skin=b">B</a> <a href="?skin=c">C</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
